<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ameer Hassan — Software Engineer, CS @ NJIT, AI/ML + FinTech" />
    <meta name="theme-color" content="#09090B" />
    <title>Ameer Hassan</title>
    <!-- Set the theme before first paint so there is no flash of the wrong one.
         Keep the ids and bg colors in sync with THEMES in src/theme.ts. -->
    <script>
      (function () {
        var BG = {
          midnight: '#09090B', slate: '#0B1220', forest: '#08150F',
          plum: '#100D1A', paper: '#FAFAFA', sand: '#F3EDE3'
        }
        var t
        try {
          var saved = localStorage.getItem('ah-theme')
          if (saved === 'dark') saved = 'midnight'
          if (saved === 'light') saved = 'paper'
          t = BG[saved]
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'midnight')
        } catch (e) {
          t = 'midnight'
        }
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', BG[t])
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
